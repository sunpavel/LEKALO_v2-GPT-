<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEKALO — прототип</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f2eee5;color:#171918;font-family:Arial,Helvetica,sans-serif}
    .open{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:linear-gradient(90deg,rgba(242,238,229,.96) 0 34%,rgba(242,238,229,.15) 65%),url('assets/lekalo-hero-reference.png') center/cover no-repeat}
    .card{max-width:470px;margin-right:auto;padding:38px 42px;background:rgba(242,238,229,.9);box-shadow:0 20px 70px #17232a22}
    .logo{font-size:24px;letter-spacing:.2em;margin-bottom:90px}.kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#77776f;margin-bottom:18px}.title{font:400 clamp(40px,6vw,72px)/.95 Georgia,'Times New Roman',serif;margin:0 0 28px}.title span{color:#c96c47;font-style:italic}.lead{font-size:15px;line-height:1.6;color:#4b4d47;margin-bottom:30px}.button{display:inline-block;padding:14px 18px;background:#163247;color:#fffdf7;text-decoration:none;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
    @media(max-width:700px){.open{background:linear-gradient(0deg,rgba(242,238,229,.96) 0 45%,rgba(242,238,229,.12) 85%),url('assets/lekalo-hero-reference.png') 58% center/cover no-repeat}.card{padding:28px;max-width:100%}.logo{margin-bottom:70px}}
  </style>
</head>
<body>
  <main class="open"><section class="card"><div class="logo">LEKALO</div><div class="kicker">Частная архитектура / генподряд</div><h1 class="title">Сначала — <span>идея.</span><br>Потом — пространство.</h1><p class="lead">Архитектурный прототип бренда: от чертежа и замысла до готовой частной резиденции.</p><a class="button" href="index.html">Открыть полный прототип ↗</a></section></main>
</body>
</html>
